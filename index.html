<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAMAKITO - Edición Chile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --cl-blue: #0039a6;
            --cl-red: #d52b1e;
            --cl-white: #ffffff;
            --dark-bg: #0b0d12;
            --card-bg: #141824;
            --text-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
            /* Detalle discreto: patrón geométrico con tonos patrios oscurecidos */
            background-image: radial-gradient(rgba(0, 57, 166, 0.15) 15%, transparent 16%),
                              radial-gradient(rgba(213, 43, 30, 0.15) 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        /* NAVEGACIÓN DISCRETA */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(11, 13, 18, 0.95);
            border-bottom: 3px solid var(--cl-red);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .nav-logo {
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--cl-white);
            letter-spacing: 2px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .star-icon {
            color: var(--cl-blue);
            font-size: 1.4rem;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 50px 20px 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        header h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 900;
            color: var(--cl-white);
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .chile-bar {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--cl-blue) 50%, var(--cl-red) 50%);
            margin: 0 auto 20px;
            border-radius: 2px;
        }

        /* CONTENEDOR PRINCIPAL */
        .gallery-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px 60px;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        /* TARJETA CON ANIMACIÓN SCROLL REVEAL */
        .photo-card {
            background-color: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--cl-blue);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.7s cubic-bezier(0.165, 0.84, 0.44, 1),
                        transform 0.7s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .photo-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .photo-card:hover {
            border-left-color: var(--cl-red);
            transform: translateY(-5px);
        }

        .img-wrapper {
            width: 100%;
            max-height: 480px;
            background-color: #050608;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo-card:hover .img-wrapper img {
            transform: scale(1.02);
        }

        .card-body {
            padding: 25px;
        }

        .card-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--cl-blue);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .description {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--cl-white);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* SECCIÓN DE VIDEO SHORT AL FINAL */
        .video-section {
            max-width: 850px;
            margin: 20px auto 80px;
            padding: 0 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.7s ease;
        }

        .video-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        .video-section h2 {
            font-size: 1.8rem;
            color: var(--cl-white);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* DISEÑO RESPONSIVO PARA YOUTUBE SHORTS (FORMATO VERTICAL 9:16) */
        .video-wrapper {
            position: relative;
            max-width: 360px; /* Ancho optimizado para el formato Short */
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-bottom: 4px solid var(--cl-red);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            background-color: #000;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 177.78%; /* Proporción vertical 9:16 */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* FOOTER */
        footer {
            background-color: #060709;
            border-top: 2px solid rgba(255, 255, 255, 0.05);
            padding: 30px 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
        }

        footer strong {
            color: var(--cl-white);
        }

        @media (max-width: 600px) {
            .card-body {
                padding: 18px;
            }
            .description {
                font-size: 0.95rem;
            }
            .video-wrapper {
                max-width: 100%; /* En móviles ocupa el ancho disponible */
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-logo"><span class="star-icon">★</span> CHAMAKITO</a>
    </nav>

    <header>
        <h1>GALERÍA CHAMAKITO</h1>
        <div class="chile-bar"></div>
    </header>

    <main class="gallery-container">

        <!-- FOTO 1 -->
        <article class="photo-card">
            <div class="img-wrapper">
                <img src="chamakito-1.jpg" alt="Foto 1" onerror="this.src='https://via.placeholder.com/800x500/141824/ffffff?text=chamakito-1.jpg'">
            </div>
            <div class="card-body">
                <div class="card-tag">FOTO #01</div>
                <div class="description">INSERTAR DESCRIPCIONES</div>
            </div>
        </article>

        <!-- FOTO 2 -->
        <article class="photo-card">
            <div class="img-wrapper">
                <img src="chamakito-2.jpg" alt="Foto 2" onerror="this.src='https://via.placeholder.com/800x500/141824/ffffff?text=chamakito-2.jpg'">
            </div>
            <div class="card-body">
                <div class="card-tag">FOTO #02</div>
                <div class="description">INSERTAR DESCRIPCIONES</div>
            </div>
        </article>

        <!-- FOTO 3 -->
        <article class="photo-card">
            <div class="img-wrapper">
                <img src="chamakito-3.jpg" alt="Foto 3" onerror="this.src='https://via.placeholder.com/800x500/141824/ffffff?text=chamakito-3.jpg'">
            </div>
            <div class="card-body">
                <div class="card-tag">FOTO #03</div>
                <div class="description">INSERTAR DESCRIPCIONES</div>
            </div>
        </article>

        <!-- FOTO 4 -->
        <article class="photo-card">
            <div class="img-wrapper">
                <img src="chamakito-4.jpg" alt="Foto 4" onerror="this.src='https://via.placeholder.com/800x500/141824/ffffff?text=chamakito-4.jpg'">
            </div>
            <div class="card-body">
                <div class="card-tag">FOTO #04</div>
                <div class="description">INSERTAR DESCRIPCIONES</div>
            </div>
        </article>

        <!-- FOTO 5 -->
        <article class="photo-card">
            <div class="img-wrapper">
                <img src="chamakito-5.jpg" alt="Foto 5" onerror="this.src='https://via.placeholder.com/800x500/141824/ffffff?text=chamakito-5.jpg'">
            </div>
            <div class="card-body">
                <div class="card-tag">FOTO #05</div>
                <div class="description">INSERTAR DESCRIPCIONES</div>
            </div>
        </article>

    </main>

    <!-- SECCIÓN DE VIDEO SHORT INTEGRADO -->
    <section class="video-section">
        <h2>VIDEO DESTACADO</h2>
        <div class="video-wrapper">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/CEVtgxTcq20" 
                    title="Chamakito Video Short" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </section>

    <footer>
        <p><strong>Chamakito Chile</strong> | Alojado en GitHub Pages 24/7</p>
    </footer>

    <!-- SCRIPT DE ANIMACIONES SCROLL REVEAL -->
    <script>
        const animatedElements = document.querySelectorAll('.photo-card, .video-section');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        }, {
            threshold: 0.15
        });

        animatedElements.forEach((el) => observer.observe(el));
    </script>
</body>
</html>
